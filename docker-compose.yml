services:
  api:
    build: .
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    env_file: .env
    volumes: ["./:/app"]
  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.address 0.0.0.0
    ports: ["8501:8501"]
    depends_on: [api]
    env_file: .env
    volumes: ["./:/app"]
